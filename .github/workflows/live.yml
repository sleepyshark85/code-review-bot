name: Live

# Live steps that spend real tokens (P3-S16, ADR 0015). A person dispatches one step by hand;
# every amount is a literal here, and nothing else can start this workflow.
# Never a required check: branch protection requires only CI's "gate".

on:
  workflow_dispatch:
    inputs:
      step:
        description: The live step to run
        type: choice
        required: true
        options:
          - smoke
          - backfill
          - evals-diff
          - evals-context

permissions:
  contents: read

jobs:
  smoke:
    name: live smoke
    if: github.ref == 'refs/heads/main' && inputs.step == 'smoke'
    concurrency:
      group: live
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # P1-S11's change to src/: a small diff whose code calls into other modules.
      SMOKE_BASE: d82b241e154fa457f7fdeef6de6ba663bf0be5b9
      SMOKE_HEAD: b754b099a0cd37dd06b0476b0f0dc18b8ee59d37
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install the bot
        run: uv sync --locked --no-dev

      - name: Write the smoke diff
        run: |
          mkdir -p "$RUNNER_TEMP/live"
          git diff --output="$RUNNER_TEMP/live/smoke.diff" "$SMOKE_BASE" "$SMOKE_HEAD" -- src
          size=$(wc -c < "$RUNNER_TEMP/live/smoke.diff")
          if [ "$size" -ge 20000 ]; then
            echo "::error::The smoke diff is $size bytes; it must be under 20 KB."
            exit 1
          fi

      - name: Review the diff twice with repository context (at most $0.60)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_BOT_MAX_RETRIES: "0"
        run: |
          out="$RUNNER_TEMP/live"
          failed=0
          for run in 1 2; do
            status=0
            uv run --no-sync review-bot "$out/smoke.diff" \
              --context-repo . \
              --context-rev "$SMOKE_HEAD" \
              --max-cost-usd 0.30 \
              --format json \
              --audit-log "$out/audit-$run.jsonl" \
              > "$out/report-$run.json" 2> "$out/stderr-$run.txt" || status=$?
            echo "Run $run exited $status."
            # 0 is no findings and 1 is findings; anything else is a failed review.
            if [ "$status" -gt 1 ]; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload the reports, audit logs and output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live/
          retention-days: 90
          if-no-files-found: warn

  backfill:
    name: live backfill
    if: github.ref == 'refs/heads/main' && inputs.step == 'backfill'
    concurrency:
      group: live
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch every pull request's head commit
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/pull/*/head'

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install the bot
        run: uv sync --locked --no-dev

      - name: Review the labelled pull requests with repository context (at most $7.20)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_BOT_MAX_RETRIES: "0"
        run: |
          out="$RUNNER_TEMP/live"
          mkdir -p "$out"
          status=0
          uv run --no-sync python -m review_bot.pr backfill \
            --pulls tests/evals/labelled/phase-3-pulls.json \
            --github-repo sleepyshark85/code-review-bot \
            --repo . \
            --context repo \
            --max-calls 12 \
            --max-usd 7.20 \
            --max-cost-usd 0.60 \
            --allow-dispatch \
            --out "$out/backfill" \
            > "$out/stdout.txt" 2> "$out/stderr.txt" || status=$?
          echo "backfill exited $status."
          exit "$status"

      - name: Upload the reports, audit logs and output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-backfill-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live/
          retention-days: 90
          if-no-files-found: warn

  evals-diff:
    name: live evals, diff mode
    if: github.ref == 'refs/heads/main' && inputs.step == 'evals-diff'
    concurrency:
      group: live
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install the bot
        run: uv sync --locked --no-dev

      - name: Record the new cases in diff mode (at most $2.70)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_BOT_MAX_RETRIES: "0"
        run: |
          out="$RUNNER_TEMP/live"
          mkdir -p "$out"
          status=0
          uv run --no-sync python -m review_bot.evals live \
            --cases tests/evals/cases \
            --mode diff \
            --runs 3 \
            --max-calls 27 \
            --max-usd 2.70 \
            --max-cost-usd 0.10 \
            --case sample-context \
            --case clean-context \
            --case injection-tool-result \
            --case injection-instruction-context \
            --case injection-canary-context \
            --case injection-delimiter-context \
            --case ticket-criteria \
            --case injection-issue \
            --case domain-money \
            --allow-dispatch \
            > "$out/stdout.txt" 2> "$out/stderr.txt" || status=$?
          echo "evals live exited $status."
          exit "$status"

      - name: Upload the recordings, audit log and output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-evals-diff-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/live/
            tests/evals/cases/sample-context/recordings/live/
            tests/evals/cases/clean-context/recordings/live/
            tests/evals/cases/injection-tool-result/recordings/live/
            tests/evals/cases/injection-instruction-context/recordings/live/
            tests/evals/cases/injection-canary-context/recordings/live/
            tests/evals/cases/injection-delimiter-context/recordings/live/
            tests/evals/cases/ticket-criteria/recordings/live/
            tests/evals/cases/injection-issue/recordings/live/
            tests/evals/cases/domain-money/recordings/live/
            .review-bot/eval-live-audit.jsonl
          retention-days: 90
          if-no-files-found: warn

  evals-context:
    name: live evals, context mode
    if: github.ref == 'refs/heads/main' && inputs.step == 'evals-context'
    concurrency:
      group: live
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install the bot
        run: uv sync --locked --no-dev

      - name: Record the new cases in context mode (at most $8.10)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_BOT_MAX_RETRIES: "0"
        run: |
          out="$RUNNER_TEMP/live"
          mkdir -p "$out"
          status=0
          uv run --no-sync python -m review_bot.evals live \
            --cases tests/evals/cases \
            --mode context \
            --runs 3 \
            --max-calls 27 \
            --max-usd 8.10 \
            --max-cost-usd 0.30 \
            --case sample-context \
            --case clean-context \
            --case injection-tool-result \
            --case injection-instruction-context \
            --case injection-canary-context \
            --case injection-delimiter-context \
            --case ticket-criteria \
            --case injection-issue \
            --case domain-money \
            --allow-dispatch \
            > "$out/stdout.txt" 2> "$out/stderr.txt" || status=$?
          echo "evals live exited $status."
          exit "$status"

      - name: Upload the recordings, audit log and output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-evals-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/live/
            tests/evals/cases/sample-context/recordings/live-context/
            tests/evals/cases/clean-context/recordings/live-context/
            tests/evals/cases/injection-tool-result/recordings/live-context/
            tests/evals/cases/injection-instruction-context/recordings/live-context/
            tests/evals/cases/injection-canary-context/recordings/live-context/
            tests/evals/cases/injection-delimiter-context/recordings/live-context/
            tests/evals/cases/ticket-criteria/recordings/live-context/
            tests/evals/cases/injection-issue/recordings/live-context/
            tests/evals/cases/domain-money/recordings/live-context/
            .review-bot/eval-live-audit.jsonl
          retention-days: 90
          if-no-files-found: warn
