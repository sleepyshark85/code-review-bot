name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # The job name "gate" is the required status check on main. Don't rename it
    # without updating branch protection.
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the P3-S16 tests diff live.yml's two fixed smoke commits.
          fetch-depth: 0

      # The pre-commit gitleaks hook only scans staged changes, so it finds nothing
      # under --all-files. This runs before `uv sync` so .venv isn't scanned.
      - name: Scan the whole tree for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.0 # keep in step with .pre-commit-config.yaml
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

          # Fail if the scanner can't detect a key: a random one, generated here and never committed.
          probe="$(mktemp -d)"
          echo "aws_access_key_id = AKIA$(LC_ALL=C tr -dc 'A-Z2-7' < /dev/urandom | head -c 16)" > "$probe/probe.txt"
          if "$RUNNER_TEMP/gitleaks" dir "$probe" --redact --no-banner; then
            echo "gitleaks self-check failed: it did not detect the probe key" >&2
            exit 1
          fi

          # A committed config or ignore file could silently switch the scan off.
          for file in .gitleaks.toml .gitleaksignore; do
            if [ -e "$file" ]; then
              echo "$file is not allowed: it would change what this scan checks" >&2
              exit 1
            fi
          done

          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner --ignore-gitleaks-allow

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Lint, format, types (pre-commit)
        run: uvx pre-commit run --all-files --show-diff-on-failure

      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing

      - name: Audit dependencies for known vulnerabilities
        run: |
          uv export --frozen --format requirements-txt --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
